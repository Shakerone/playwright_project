name: UI tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-latest
    environment: playwright
    env:
      APP_URL: ${{ vars.APP_URL }}
      HEADLESS: "true"
      BROWSERS: '["chromium"]'
      TEST_USER.EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER.USERNAME: ${{ secrets.TEST_USER_USERNAME }}
      TEST_USER.PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      TEST_DATA.IMAGE_PNG_FILE: testdata/files/image.png

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Playwright tests
        run: python -m pytest -m regression --alluredir=allure-results --numprocesses 2

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: warn
          retention-days: 14

  publish-report:
    needs: run-tests
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Get Allure history
        continue-on-error: true
        run: |
          mkdir -p gh-pages
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch --depth=1 origin gh-pages
            if git cat-file -e FETCH_HEAD:index.html 2>/dev/null; then
              git archive FETCH_HEAD | tar -x -C gh-pages
            else
              echo "No published report found; starting with empty Allure history."
            fi
          fi

      - name: Download Allure results
        uses: actions/download-artifact@v7.0.0
        with:
          name: allure-results
          path: allure-results

      - name: Install Allure CLI
        env:
          ALLURE_VERSION: "2.44.0"
        run: |
          java -version
          curl --fail --location --retry 3 \
            "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz" \
            --output "$RUNNER_TEMP/allure.tgz"
          tar -xzf "$RUNNER_TEMP/allure.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Generate Allure report with history
        run: |
          mkdir -p allure-history
          cp -R gh-pages/. allure-history/
          if [ -d gh-pages/last-history ]; then
            mkdir -p allure-results/history
            cp -R gh-pages/last-history/. allure-results/history/
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          owner, repository = os.environ["GITHUB_REPOSITORY"].split("/")
          pages_url = f"https://{owner.lower()}.github.io/{repository}"
          run_id = os.environ["GITHUB_RUN_ID"]
          run_number = os.environ["GITHUB_RUN_NUMBER"]
          executor = {
              "name": "GitHub Actions",
              "type": "github",
              "reportName": "Allure Report with history",
              "url": pages_url,
              "reportUrl": f"{pages_url}/{run_number}/",
              "buildUrl": f"{os.environ['GITHUB_SERVER_URL']}/{owner}/{repository}/actions/runs/{run_id}",
              "buildName": f"GitHub Actions Run #{run_number}",
              "buildOrder": int(run_number),
          }
          Path("allure-results/executor.json").write_text(
              json.dumps(executor), encoding="utf-8"
          )
          PY
          allure generate allure-results --clean -o allure-report
          mkdir -p "allure-history/${GITHUB_RUN_NUMBER}"
          cp -R allure-report/. "allure-history/${GITHUB_RUN_NUMBER}/"
          if [ -d allure-report/history ]; then
            mkdir -p allure-history/last-history
            cp -R allure-report/history/. allure-history/last-history/
          fi
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=./%s/index.html">\n' \
            "$GITHUB_RUN_NUMBER" > allure-history/index.html

      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
